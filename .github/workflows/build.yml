name: .NET CI/CD Pipeline

on:
  push:
    branches: [ "work" ]
  pull_request:
    branches: [ "work" ]

jobs:
  # 1️⃣ СТАДИЯ: Сборка + Тесты
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore ./CheckPassword/CheckPassword.slnx

      - name: Build solution
        run: dotnet build ./CheckPassword/CheckPassword.slnx --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test ./TestPassword/TestPassword.csproj --configuration Release --no-build `
             --logger "trx;LogFileName=test-results.trx" `
             --results-directory ./test-output

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./test-output/*.trx
          retention-days: 7

  # 2️⃣ СТАДИЯ: Публикация артефакта (запускается ТОЛЬКО после успешных тестов)
  publish-artifact:
    needs: build-and-test
    runs-on: windows-latest
    # Публикуем только при прямом пуше в основную ветку (уберите, если нужно публиковать и из PR)
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Console Application
        run: dotnet publish ./CheckPassword/CheckPassword.csproj `
             --configuration Release `
             --output ./publish-output `
             --no-restore `
             --verbosity normal

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CheckPassword-Console-Release
          path: ./publish-output/
          retention-days: 7
